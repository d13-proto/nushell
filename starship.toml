# https://github.com/starship/starship/blob/master/docs/public/presets/toml/nerd-font-symbols.toml

"$schema" = "https://starship.rs/config-schema.json"

format = """[╭──](#999999) $all$fill $cmd_duration$status$battery$memory_usage$time\
$line_break[╰─](#999999)$character
"""

add_newline = false

[fill]
symbol = "─"
style = "#999999"



[aws]
symbol = " "

[battery]
unknown_symbol = "󰂑 "

[[battery.display]]
threshold = 25

[buf]
symbol = " "

[bun]
symbol = " "

[c]
symbol = " "

